<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainFit Thailand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* ===================== สี CI จาก Brand Guideline 1.5 =====================
   แก้สีแบรนด์ได้ที่บล็อกนี้บล็อกเดียว ทั้งหน้าจะเปลี่ยนตาม           */
:root{
  --pms-1505:#F05A38;   /* ส้ม   R240 G90  B56  */
  --pms-7548:#FBAE17;   /* เหลือง R251 G174 B23  */
  --pms-233:#CE128B;    /* ชมพู  R206 G18  B139 */
  --pms-299:#00BBE7;    /* ฟ้า   R0   G187 B231 */
  --pms-361:#50B748;    /* เขียว R80  G183 B72  */
  --blue-ink:#0086A8;   /* ฟ้าเข้ม ใช้กับปุ่มส่งข้อมูลเพื่อให้อ่านง่าย */
 
  --ink:#22303A;
  --ink-soft:#5D7079;
  --paper:#FFFFFF;
  --wash:#F0FAFD;
  --line:#DCE9EE;
  --field:#F8FCFE;
  --shadow:0 18px 40px -18px rgba(0,110,140,.28);
  --font:'Prompt','Noto Sans Thai',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E8F4F8; --ink-soft:#9DB4BE; --paper:#141E24; --wash:#0D161A;
    --line:#26363E; --field:#1A262C; --blue-ink:#4ED4FF;
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
}
 
*{box-sizing:border-box}
html,body{margin:0; padding:0; width:100%; overflow-x:hidden}
body{
  background:var(--wash); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:16px max(12px, env(safe-area-inset-left)) calc(36px + env(safe-area-inset-bottom));
}
.bf-card{
  background:var(--paper); width:100%; max-width:420px;
  border-radius:22px; overflow:hidden; box-shadow:var(--shadow);
}
.bf-progress{height:5px; background:var(--line); overflow:hidden}
.bf-progress i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--pms-299),var(--pms-361),var(--pms-7548),var(--pms-1505),var(--pms-233));
  transition:width .45s cubic-bezier(.4,0,.2,1);
}
.bf-inner{padding:clamp(18px,5vw,24px) clamp(14px,4.5vw,20px) 26px}
 
/* ---------- หัวแบรนด์ ---------- */
.bf-logo{height:26px; width:auto; display:block; margin-bottom:16px}
.bf-wordmark{font-size:19px; font-weight:700; color:#6D6E71; line-height:1; margin-bottom:16px}
.bf-wordmark span{color:var(--blue-ink)}
 
/* ---------- ข้อความหลัก ---------- */
.bf-greet{
  font-size:clamp(19px,5.2vw,21px); font-weight:600; line-height:1.45;
  margin:0 0 8px; color:var(--ink); overflow-wrap:anywhere;
}
.bf-intro{margin:0 0 18px; font-size:13.5px; color:var(--ink-soft); line-height:1.75; white-space:pre-line}
.bf-intro b{color:var(--blue-ink); font-weight:600}
 
/* ---------- กรอบฟอร์มสีฟ้า ตามบรีฟ ---------- */
.form-box{
  border:1.5px solid var(--pms-299); border-radius:18px;
  padding:16px 14px 4px; margin-bottom:16px;
}
.q{margin-bottom:15px}
.q-head{display:flex; align-items:center; gap:9px; margin-bottom:8px}
.q-dot{
  width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:11.5px; font-weight:700; background:var(--field); color:var(--ink-soft);
  border:1.5px solid var(--line); transition:all .25s ease;
}
/* เลขข้อไล่ 5 สีตามโลโก้ สีจะติดเมื่อกรอกข้อนั้นเสร็จ */
.q.done .q-dot{border-color:transparent; color:#fff}
.q1.done .q-dot{background:var(--pms-1505)}
.q2.done .q-dot{background:var(--pms-7548); color:#4A3200}
.q3.done .q-dot{background:var(--pms-233)}
.q4.done .q-dot{background:var(--pms-299)}
.q5.done .q-dot{background:var(--pms-361)}
.q-head label{font-size:14.5px; font-weight:500; line-height:1.4; color:var(--ink); cursor:pointer}
.q-head .req{color:var(--pms-233); margin-left:1px}
 
.field{position:relative}
.field input, .field select{
  width:100%; height:50px; padding:0 15px;
  font-family:var(--font); font-size:16px; color:var(--ink);
  background:var(--field); border:1.5px solid var(--line); border-radius:12px;
  transition:border-color .2s, background .2s, box-shadow .2s;
}
.field select{-webkit-appearance:none; appearance:none; padding-right:42px; cursor:pointer}
.field.sel::after{
  content:""; position:absolute; right:17px; top:50%; width:8px; height:8px;
  border-right:2px solid var(--ink-soft); border-bottom:2px solid var(--ink-soft);
  transform:translateY(-70%) rotate(45deg); pointer-events:none;
}
.field input::placeholder{color:var(--ink-soft); opacity:.7}
.field input:focus, .field select:focus{
  outline:none; border-color:var(--pms-299); background:var(--paper);
  box-shadow:0 0 0 4px rgba(0,187,231,.16);
}
.q.done .field input, .q.done .field select{border-color:var(--pms-299); background:var(--paper); font-weight:500}
.q.bad .field input{border-color:var(--pms-1505); background:rgba(240,90,56,.06)}
.q-error{display:none; margin:6px 0 0; font-size:12px; color:var(--pms-1505); font-weight:500}
.q.bad .q-error{display:block}
 
/* ---------- ตัวเลือกอายุแบบเลื่อนขึ้นลง ---------- */
.wheel-wrap{position:relative; border:1.5px solid var(--line); border-radius:12px; background:var(--field); overflow:hidden}
.q.done .wheel-wrap{border-color:var(--pms-299); background:var(--paper)}
.wheel{
  height:132px; overflow-y:scroll; scroll-snap-type:y mandatory;
  scrollbar-width:none; -ms-overflow-style:none; -webkit-overflow-scrolling:touch;
  position:relative; z-index:2;
}
.wheel::-webkit-scrollbar{display:none}
.wheel-item{
  height:44px; display:flex; align-items:center; justify-content:center;
  scroll-snap-align:center; font-size:16px; color:var(--ink-soft);
  transition:color .18s, font-size .18s; cursor:pointer; user-select:none;
}
.wheel-item.on{color:var(--blue-ink); font-weight:600; font-size:18px}
.wheel-pad{height:44px}
.wheel-band{
  position:absolute; left:8px; right:8px; top:44px; height:44px; border-radius:9px;
  border-top:1.5px solid var(--pms-299); border-bottom:1.5px solid var(--pms-299);
  background:rgba(0,187,231,.07); pointer-events:none; z-index:1;
}
.wheel-hint{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  font-size:10px; color:var(--pms-299); letter-spacing:.06em; pointer-events:none;
  z-index:3; font-weight:600;
}
 
.bf-hint{display:none; align-items:center; gap:7px; margin:0 0 12px; font-size:12.5px; color:var(--pms-1505); font-weight:500}
.bf-hint.on{display:flex}
.bf-hint b{
  width:16px; height:16px; border-radius:50%; background:var(--pms-1505); color:#fff;
  font-size:10.5px; display:grid; place-items:center; flex:none; font-weight:700;
}
 
/* ---------- ปุ่ม ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:52px; padding:10px 16px; border:0; border-radius:26px;
  cursor:pointer; font-family:var(--font); font-size:16px; font-weight:500;
  line-height:1.35; color:#fff; text-align:center; text-decoration:none;
  transition:transform .15s ease, box-shadow .2s, background .2s;
}
.btn:active{transform:scale(.975)}
.btn-next{background:var(--blue-ink); box-shadow:0 8px 20px -8px rgba(0,134,168,.75)}
.btn-next:disabled{background:var(--line); color:var(--ink-soft); box-shadow:none; cursor:not-allowed}
.btn-chat{background:var(--pms-361); box-shadow:0 8px 20px -8px rgba(80,183,72,.8)}
.btn-call{background:var(--pms-233); box-shadow:0 8px 20px -8px rgba(206,18,139,.8)}
.btn-stack{display:flex; flex-direction:column; gap:12px}
.bf-foot{margin:12px 0 0; text-align:center; font-size:11.5px; color:var(--ink-soft); line-height:1.5; white-space:pre-line}
 
/* ---------- หน้าบันทึกข้อมูลเรียบร้อย ---------- */
.done-wrap{padding:30px 16px 24px; text-align:center}
.tick{width:76px; height:76px; margin:0 auto 16px; display:block}
.tick .halo{fill:var(--pms-361); opacity:.14}
.tick .disc{fill:var(--pms-361)}
.tick .mark{
  fill:none; stroke:#fff; stroke-width:6; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:1; stroke-dashoffset:0;      /* ค่าตั้งต้นคือวาดเสร็จแล้ว ไม่ว่าแอนิเมชันจะทำงานหรือไม่ */
  animation:draw .5s .12s cubic-bezier(.65,0,.35,1) backwards;
}
@keyframes draw{from{stroke-dashoffset:1} to{stroke-dashoffset:0}}
.done-title{font-size:22px; font-weight:600; line-height:1.45; margin:0 0 8px; color:var(--ink)}
.done-sub{margin:0 0 20px; font-size:13.5px; color:var(--ink-soft); line-height:1.75; white-space:pre-line}
.recap{
  text-align:left; background:var(--wash); border:1px solid var(--line);
  border-radius:16px; padding:4px 15px; margin:0 0 20px;
}
.recap-row{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  padding:10px 0; border-bottom:1px solid var(--line);
}
.recap-row:last-child{border-bottom:0}
.recap-row dt{font-size:12.5px; color:var(--ink-soft); flex:none}
.recap-row dd{
  margin:0; font-size:13.5px; font-weight:500; line-height:1.5;
  color:var(--ink); text-align:right; overflow-wrap:anywhere;
}
 
/* ---------- สถานะโหลดและข้อผิดพลาด ---------- */
.state-wrap{padding:44px 22px; text-align:center}
.state-title{font-size:19px; font-weight:600; line-height:1.45; margin:0 0 8px; color:var(--ink)}
.state-sub{margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.7}
.spinner{
  width:34px; height:34px; margin:0 auto 18px; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--pms-299); animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
 
/* แถบ debug ซ่อนไว้ เปิดดูตอนทดสอบด้วยการต่อท้าย URL ว่า ?debug=1 */
#debug{
  display:none; width:100%; max-width:420px; margin:14px 0 0; text-align:center;
  font-size:11px; color:var(--ink-soft); opacity:.7; word-break:break-all;
}
#debug.on{display:block}
[hidden]{display:none !important}
 
@media (max-width:360px){
  .bf-greet{font-size:19px}
  .field input, .field select{height:47px; font-size:15px}
  .btn{min-height:49px; font-size:15px}
  .q-head label{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>
 
<div class="bf-card">
  <div class="bf-progress"><i id="bar"></i></div>
 
  <!-- ============ สถานะ 1 กำลังโหลด หรือ ผิดพลาด ============ -->
  <div id="view-state" class="state-wrap">
    <div class="spinner" id="spinner"></div>
    <h2 class="state-title" id="state-title">กำลังเชื่อมต่อ</h2>
    <p class="state-sub" id="state-sub">กรุณารอสักครู่</p>
  </div>
 
  <!-- ============ สถานะ 2 แบบฟอร์ม ============ -->
  <div id="view-form" class="bf-inner" hidden>
    <img class="bf-logo" id="logo" alt="BrainFit Thailand" hidden>
    <div class="bf-wordmark" id="wordmark" hidden>Brain<span>Fit</span></div>
 
    <h2 class="bf-greet" id="greet"></h2>
    <p class="bf-intro" id="intro"></p>
 
    <div class="form-box" id="formBox"></div>
 
    <p class="bf-hint" id="hint"><b>!</b> ยังเหลืออีก <span id="left"></span> ข้อ</p>
    <button class="btn btn-next" id="btnNext" disabled></button>
    <p class="bf-foot" id="footForm"></p>
  </div>
 
  <!-- ============ สถานะ 3 บันทึกข้อมูลเรียบร้อย ============ -->
  <div id="view-done" class="done-wrap" hidden>
    <svg class="tick" viewBox="0 0 72 72" aria-hidden="true">
      <circle class="halo" cx="36" cy="36" r="35"></circle>
      <circle class="disc" cx="36" cy="36" r="26"></circle>
      <path class="mark" pathLength="1" d="M25.5 36.5 L33 44 L47 29"></path>
    </svg>
    <h2 class="done-title" id="doneTitle"></h2>
    <p class="done-sub" id="doneSub"></p>
    <dl class="recap" id="recap"></dl>
    <div class="btn-stack">
      <button class="btn btn-chat" id="btnChat"></button>
      <a class="btn btn-call" id="btnCall" href="#"></a>
    </div>
    <p class="bf-foot" id="footDone"></p>
  </div>
</div>
 
<div id="debug"></div>
 
<script>
/* ---------- ไฟล์โลโก้ BrainFit ฝังมาในโค้ดแล้ว ห้ามแก้บรรทัดยาวด้านล่างนี้ ---------- */
const LOGO_URL: "logo.png",
 
/* ==========================================================================
   ⚙️  ส่วนตั้งค่าทั้งหมดอยู่ในบล็อกนี้บล็อกเดียว
   ========================================================================== */
const CONFIG = {
 
  /* ---------- 4 ค่านี้ต้องใส่ให้ถูก ไม่งั้นหน้าจะทำงานไม่ครบ ---------- */
 
  // LIFF ID จาก LINE Developers Console แท็บ LIFF
  // ต้องเป็น LIFF app ที่ตั้ง Endpoint URL ตรงกับ URL ของหน้านี้
  LIFF_ID: "2010166992-Ms8DVgUg",
 
  // Basic ID ของ LINE OA ใส่เครื่องหมาย @ ด้วย
  LINE_OA_ID: "@332pxzud",
 
  // เบอร์โทรของปุ่มโทรออก ใส่เป็นตัวเลขล้วนไม่ต้องมีขีดหรือเว้นวรรค
  PHONE_NUMBER: "0917743769",
 
  // URL ของ Google Apps Script หลังกด Deploy ลงท้ายด้วย /exec
  SHEET_API_URL: "https://script.google.com/macros/s/AKfycbywaHqqheHeaS1lxKVpUfC86eUsop7K6NNHQOUCOa48lIPFkasijzTWbdc-gBtveX6qxA/exec",
 
 
  /* ---------- โลโก้และข้อความ แก้ได้ตามต้องการ ---------- */
 
  // โลโก้ฝังมาในไฟล์นี้เรียบร้อยแล้ว ไม่ต้องอัปโหลดไฟล์รูปแยก
  // ถ้าอยากเปลี่ยนเป็นไฟล์รูปของตัวเอง ให้เปลี่ยนเป็นชื่อไฟล์ เช่น LOGO_URL: "logo.png"
  LOGO_URL: LOGO_DATA,
 
  GREETING: "สวัสดีค่ะ คุณ {name}",
 
  // ข้อความในเครื่องหมาย | จะกลายเป็นตัวหนาสีฟ้า
  INTRO: "BrainFit ยินดีให้ข้อมูลเพิ่มเติม เพื่อความสะดวกและรวดเร็วในการรับข้อมูลของท่าน กรุณากรอกแบบฟอร์มเพื่อให้เจ้าหน้าที่ติดต่อกลับ|ภายใน 24 ชั่วโมง|",
 
  BTN_SUBMIT: "ส่งข้อมูล",
  BTN_SAVING: "กำลังบันทึก",
  FOOT_FORM: "ข้อมูลของท่านใช้สำหรับติดต่อกลับและแนะนำคอร์สที่เหมาะสมเท่านั้น",
 
  DONE_TITLE: "บันทึกข้อมูลเรียบร้อย",
  // อยากให้ขึ้นบรรทัดใหม่ ให้แยกเป็นคนละบรรทัดในวงเล็บเหลี่ยม 1 บรรทัดในนี้ = 1 บรรทัดบนจอ
  DONE_SUB: [
    "ท่านสามารถเลือกโทรติดต่อ หรือกดปุ่มด้านล่าง",
    "เพื่อแชทกับเจ้าหน้าที่ได้ทันทีค่ะ"
  ],
  BTN_CHAT: "ทักแชทพูดคุยกับ BrainFit",
  BTN_CALL: "โทร 091 774 3769",
  FOOT_DONE: "เจ้าหน้าที่ติดต่อกลับภายใน 24 ชั่วโมง",
 
  // ข้อความที่จะไปโผล่ในกล่องพิมพ์แชท รอให้ผู้ใช้กดส่งเอง
  // ใส่ {a1} ถึง {a5} เพื่อดึงคำตอบข้อ 1 ถึง 5 มาต่อท้ายได้
  CHAT_MESSAGE: "สนใจสอบถามเรื่อง {a5} ค่ะ",
 
  // true  = คนเดิมเปิดลิงก์ซ้ำจะได้กรอกใหม่ ทุกครั้งที่กรอกเป็นแถวใหม่ในชีต
  // false = คนที่กรอกไปแล้วในรอบนี้จะข้ามไปหน้าปุ่มติดต่อเลย
  ALLOW_RESUBMIT: true,
 
 
  /* ---------- คำถาม เพิ่ม ลด แก้ได้อิสระ ----------
     type = "text" ช่องพิมพ์ | "tel" เบอร์โทร | "email" อีเมล
            "wheel" เลื่อนขึ้นลง | "select" ดรอปดาวน์
     คำตอบจะลงชีตเรียงจากคอลัมน์ G เป็นต้นไปตามลำดับข้อ
     ถ้าเพิ่มข้อที่ 6 ให้ไปเติมหัวคอลัมน์ L ในชีตเองด้วย            */
  QUESTIONS: [
    { type:"text",  label:"ชื่อผู้ติดต่อ", short:"ชื่อผู้ติดต่อ", placeholder:"ชื่อ นามสกุล",
      error:"กรุณากรอกชื่อผู้ติดต่อ" },
 
    { type:"tel",   label:"เบอร์โทร",     short:"เบอร์โทร",     placeholder:"0XX XXX XXXX",
      error:"กรุณากรอกเบอร์โทร 9 ถึง 10 หลัก" },
 
    { type:"email", label:"อีเมล",        short:"อีเมล",        placeholder:"name@email.com",
      error:"รูปแบบอีเมลไม่ถูกต้อง" },
 
    { type:"wheel", label:"อายุเด็ก",      short:"อายุเด็ก",     placeholder:"เลือกอายุ ⬇️",
      options:["แรกเกิด","1 ขวบ","2 ขวบ","3 ขวบ","4 ขวบ","5 ขวบ","6 ขวบ","7 ขวบ","8 ขวบ","9 ขวบ",
               "10 ขวบ","11 ขวบ","12 ขวบ","13 ปี","14 ปี","15 ปี","16 ปี","17 ปี","18 ปีขึ้นไป"] },
 
    { type:"select", label:"เลือกเรื่องที่สนใจ", short:"เรื่องที่สนใจ", placeholder:"เลือกเรื่องที่สนใจ",
      options:["พัฒนาสมาธิ","พัฒนาลายมือ","คอร์สปิดเทอม","ประเมินทักษะสมอง","เรื่องอื่น ๆ"] }
  ]
};
/* ====================== จบส่วนตั้งค่า ====================== */
 
 
const $ = id => document.getElementById(id);
 
// ข้อความจะเขียนเป็นบรรทัดเดียว หรือแยกเป็นรายการหลายบรรทัดก็ได้
function textOf(v){ return Array.isArray(v) ? v.join('\n') : String(v); }
const views = { state:$('view-state'), form:$('view-form'), done:$('view-done') };
function show(name){ Object.keys(views).forEach(k => views[k].hidden = (k !== name)); }
function setState(title, sub, spin){
  $('state-title').textContent = title;
  $('state-sub').textContent = sub;
  $('spinner').hidden = !spin;
  show('state');
}
function setDebug(text){
  $('debug').textContent = text;
  if (new URLSearchParams(location.search).get('debug') === '1') $('debug').classList.add('on');
}
 
let profile = null;
let ready = false;
const answers = new Array(CONFIG.QUESTIONS.length).fill("");
 
// ---------- Tracking Source จาก ?source= ที่ติดมากับลิงก์แอด ----------
const urlParams = new URLSearchParams(window.location.search);
let trackingSource = urlParams.get('source');
if (trackingSource) sessionStorage.setItem('liff_source', trackingSource);
else trackingSource = sessionStorage.getItem('liff_source') || 'Organic / No Ref';
 
 
// ================= เริ่มทำงาน =================
async function main(){
  // LIFF ต้องรันบน https เท่านั้น เปิดไฟล์จากเครื่องตรง ๆ จะไม่ผ่านด่านนี้
  if (location.protocol === 'file:'){
    setState("เปิดไฟล์แบบนี้ไม่ได้", "หน้านี้ต้องเปิดผ่าน https เท่านั้น เช่นวางบน GitHub Pages เพราะ LINE Login ไม่รองรับการเปิดไฟล์ตรงจากเครื่อง", false);
    setDebug("ERROR: protocol = file:");
    return;
  }
 
  try{
    await liff.init({ liffId: CONFIG.LIFF_ID });
    setDebug(`LIFF Ready | ${liff.getOS()} | inClient: ${liff.isInClient()} | src: ${trackingSource}`);
 
    if (!liff.isLoggedIn()){
      liff.login({ redirectUri: window.location.href });   // รักษาค่า ?source= ไว้หลัง login
      return;
    }
 
    const friendship = await liff.getFriendship();
 
    if (friendship.friendFlag){
      profile = await liff.getProfile();
      saveToSheet({ action:"add_friend" });                // บันทึก Lead ทันทีที่เป็นเพื่อน
 
      if (!CONFIG.ALLOW_RESUBMIT && sessionStorage.getItem('survey_done') === '1') renderDone();
      else renderForm();
    } else {
      setState("ยังไม่ได้เพิ่มเพื่อน", "กำลังเปิดหน้าเพิ่มเพื่อน", true);
      if (typeof liff.requestFriendship === 'function'){
        await liff.requestFriendship();
        location.reload();
      } else {
        window.location.href = `https://line.me/R/ti/p/${CONFIG.LINE_OA_ID}`;
      }
    }
  } catch(err){
    setState("เชื่อมต่อไม่สำเร็จ", explainError(err), false);
    setDebug(`code: ${err.code || '-'} | ${err.message} | url: ${location.origin + location.pathname}`);
  }
}
 
// แปล error ของ LIFF เป็นภาษาคน เพื่อให้หาสาเหตุได้เร็ว
function explainError(err){
  const c = err.code || "";
  if (c === "INVALID_CONFIG" || c === "INVALID_ARGUMENT") return "ค่า LIFF_ID ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง";
  if (c === "UNAUTHORIZED" || c === "FORBIDDEN") return "URL ของหน้านี้ไม่ตรงกับ Endpoint URL ที่ตั้งไว้ใน LINE Developers Console";
  if (c === "INIT_FAILED") return "เชื่อมต่อ LINE ไม่สำเร็จ ตรวจว่า Endpoint URL เป็น https และตรงกับหน้านี้";
  return err.message;
}
 
 
// ================= ตรวจความถูกต้อง =================
function isPhone(v){ const d = String(v).replace(/\D/g,''); return d.charAt(0) === '0' && (d.length === 9 || d.length === 10); }
function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()); }
function isValid(q, v){
  if (!v || !String(v).trim()) return false;
  if (q.type === 'tel') return isPhone(v);
  if (q.type === 'email') return isEmail(v);
  return String(v).trim().length >= 2;
}
 
 
// ================= หน้าแบบฟอร์ม =================
function renderForm(){
  // โลโก้ ถ้าโหลดไม่ได้จะสลับไปใช้ตัวหนังสือให้อัตโนมัติ
  if (CONFIG.LOGO_URL){
    const img = $('logo');
    img.onload  = () => { img.hidden = false; };
    img.onerror = () => { $('wordmark').hidden = false; };
    img.src = CONFIG.LOGO_URL;
  } else {
    $('wordmark').hidden = false;
  }
 
  const name = (profile.displayName || '').trim();
  $('greet').textContent = CONFIG.GREETING.replace('{name}', name.length > 22 ? name.slice(0,22) : name);
 
  const parts = textOf(CONFIG.INTRO).split('|');
  $('intro').innerHTML = parts.map((t,i) => i % 2 ? `<b>${t}</b>` : t).join('');
 
  $('btnNext').textContent = CONFIG.BTN_SUBMIT;
  $('footForm').textContent = textOf(CONFIG.FOOT_FORM);
 
  buildQuestions();
  ready = true;
  sync();
  $('btnNext').onclick = submitForm;
  show('form');
}
 
function buildQuestions(){
  const box = $('formBox');
  box.innerHTML = "";
 
  CONFIG.QUESTIONS.forEach((q, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'q q' + (i + 1);
    wrap.id = 'qa' + i;
 
    const head = `<div class="q-head"><span class="q-dot">${i+1}</span>
                  <label for="f${i}">${q.label}<span class="req">*</span></label></div>`;
 
    if (q.type === 'wheel'){
      // ตำแหน่งแรกเป็นข้อความบอกให้เลือก ยังไม่นับว่าตอบแล้ว
      const list = [q.placeholder].concat(q.options);
      wrap.innerHTML = head +
        `<div class="wheel-wrap">
           <div class="wheel-band"></div>
           <span class="wheel-hint">เลื่อน</span>
           <div class="wheel" id="f${i}">
             <div class="wheel-pad"></div>
             ${list.map((a,n) => `<div class="wheel-item" data-n="${n}">${a}</div>`).join('')}
             <div class="wheel-pad"></div>
           </div>
         </div>`;
      box.appendChild(wrap);
      setupWheel(wrap.querySelector('.wheel'), i, list);
 
    } else if (q.type === 'select'){
      wrap.innerHTML = head +
        `<div class="field sel">
           <select id="f${i}">
             <option value="">${q.placeholder}</option>
             ${q.options.map(o => `<option>${o}</option>`).join('')}
           </select>
         </div>`;
      box.appendChild(wrap);
      wrap.querySelector('select').addEventListener('change', e => { answers[i] = e.target.value; sync(); });
 
    } else {
      // inputmode ทำให้มือถือเด้งแป้นพิมพ์ที่ตรงกับชนิดข้อมูลขึ้นมาเลย
      const extra = q.type === 'tel'   ? ' inputmode="numeric" autocomplete="tel" maxlength="12"'
                  : q.type === 'email' ? ' inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"'
                  : ' autocomplete="name"';
      wrap.innerHTML = head +
        `<div class="field"><input id="f${i}" type="${q.type === 'text' ? 'text' : q.type}"${extra} placeholder="${q.placeholder}"></div>
         <p class="q-error">${q.error || 'กรอกข้อมูลไม่ถูกต้อง'}</p>`;
      box.appendChild(wrap);
 
      const input = wrap.querySelector('input');
      input.addEventListener('input', e => {
        let v = e.target.value;
        if (q.type === 'tel'){ v = v.replace(/\D/g,'').slice(0,10); e.target.value = v; }
        answers[i] = isValid(q, v) ? v.trim() : "";
        wrap.classList.remove('bad');
        sync();
      });
      input.addEventListener('blur', e => {
        const v = e.target.value.trim();
        wrap.classList.toggle('bad', v.length > 0 && !isValid(q, v));
      });
    }
  });
}
 
function setupWheel(el, idx, list){
  const H = 44;
  const items = [...el.querySelectorAll('.wheel-item')];
  let timer;
  function mark(){
    const n = Math.round(el.scrollTop / H);
    items.forEach((it, k) => it.classList.toggle('on', k === n));
    answers[idx] = n > 0 ? list[n] : "";
    sync();
  }
  el.addEventListener('scroll', () => { clearTimeout(timer); timer = setTimeout(mark, 90); });
  items.forEach((it, n) => it.addEventListener('click', () => el.scrollTo({ top: n * H, behavior:'smooth' })));
  mark();
}
 
function sync(){
  if (!ready) return;
  let filled = 0;
  CONFIG.QUESTIONS.forEach((q, i) => {
    const ok = !!answers[i];
    const el = $('qa' + i);
    if (el) el.classList.toggle('done', ok);
    if (ok) filled++;
  });
  const total = CONFIG.QUESTIONS.length;
  $('bar').style.width = (filled / total * 100) + '%';
  $('btnNext').disabled = filled < total;
  $('left').textContent = total - filled;
  $('hint').classList.toggle('on', filled > 0 && filled < total);
}
 
async function submitForm(){
  $('btnNext').disabled = true;
  $('btnNext').textContent = CONFIG.BTN_SAVING;
 
  // รอให้บันทึกเสร็จก่อนเปลี่ยนหน้า กันข้อมูลหาย
  await saveToSheet({ action:"survey", answers: answers });
 
  sessionStorage.setItem('survey_done', '1');
  sessionStorage.setItem('survey_answers', JSON.stringify(answers));
  renderDone();
}
 
 
// ================= หน้าบันทึกข้อมูลเรียบร้อย =================
function renderDone(){
  const saved = JSON.parse(sessionStorage.getItem('survey_answers') || '[]');
  const list = answers.some(a => a) ? answers : saved;
 
  $('doneTitle').textContent = textOf(CONFIG.DONE_TITLE);
  $('doneSub').textContent = textOf(CONFIG.DONE_SUB);
  $('btnChat').textContent = CONFIG.BTN_CHAT;
  $('btnCall').textContent = CONFIG.BTN_CALL;
  $('btnCall').href = 'tel:' + CONFIG.PHONE_NUMBER;      // กดแล้วโทรออกจากเครื่องทันที
  $('footDone').textContent = textOf(CONFIG.FOOT_DONE);
  $('bar').style.width = '100%';
 
  const recap = $('recap');
  recap.innerHTML = "";
  CONFIG.QUESTIONS.forEach((q, i) => {
    if (!list[i]) return;
    const row = document.createElement('div');
    row.className = 'recap-row';
    row.innerHTML = `<dt>${q.short}</dt><dd>${list[i]}</dd>`;
    recap.appendChild(row);
  });
 
  $('btnChat').onclick = () => {
    const msg = encodeURIComponent(buildChatMessage(list));
    window.location.href = `https://line.me/R/oaMessage/${CONFIG.LINE_OA_ID}/?${msg}`;
  };
  show('done');
}
 
// แทนที่ {a1} ถึง {a5} ในข้อความแชท ด้วยคำตอบแต่ละข้อ
function buildChatMessage(list){
  let text = CONFIG.CHAT_MESSAGE;
  CONFIG.QUESTIONS.forEach((q, i) => {
    text = text.split('{a' + (i + 1) + '}').join(list[i] || '');
  });
  return text.replace(/\s{2,}/g, ' ').trim();
}
 
 
// ================= ส่งข้อมูลเข้า Google Sheet =================
function saveToSheet(extra){
  const data = Object.assign({
    userId: profile.userId,
    displayName: profile.displayName,
    pictureUrl: profile.pictureUrl,
    source: trackingSource
  }, extra);
 
  return fetch(CONFIG.SHEET_API_URL, {
    method: 'POST',
    body: JSON.stringify(data),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  }).catch(err => console.error("Sheet Error:", err));
}
 
main();
</script>
